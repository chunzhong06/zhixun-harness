[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhixun-harness"
version = "0.2.4"
description = "共享研究、真实续训和比赛交付内核"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3"]

[project.optional-dependencies]
training = ["torch>=2.7,<3", "scipy>=1.15", "scikit-learn>=1.7", "pandas>=2.2", "cloudpickle>=3.1", "psutil>=7"]
tracking = ["swanlab==0.10.4"]
dev = ["pytest>=8"]

[project.scripts]
harness-research = "harness.cli.research:main"
harness-contest = "harness.cli.contest:main"
harness-train = "harness.adapters.platforms.platform_train:main"
harness-predict = "harness.adapters.platforms.baselines.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
